<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deepfake Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-primary {
      border-radius: 2rem;
    }
    .preview-img {
      max-height: 300px;
      object-fit: contain;
      border-radius: 0.5rem;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .preview-img:hover {
      transform: scale(1.05);
      opacity: 0.85;
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    #drop-area.border-primary {
      background-color: #eaf4ff;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Deepfake Detector</a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="text-center mb-4">Upload Image for Prediction</h3>

        <!-- Upload Form -->
        <form id="upload-form" enctype="multipart/form-data">
          <div id="drop-area" class="mb-3 border border-2 rounded p-4 text-center bg-light" style="cursor:pointer;">
            <p class="text-muted mb-2">Drag & drop or click to select an image</p>
            <input id="file-input" type="file" name="file" accept="image/*" class="d-none" required>
            <img id="preview" class="preview-img mt-3 d-none fade-in" alt="Preview" />
          </div>
          <div class="text-center">
            <button class="btn btn-primary px-4 mt-2" type="submit">Predict</button>
          </div>
          <div class="alert alert-warning mt-4" style="font-size: 0.9rem;">
            <strong>Note:</strong> System works best with deepfake images generated by GAN (e.g. StyleGAN).
          </div>
          <div id="loading-indicator" class="text-center d-none mt-3">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p>Processing your image, please wait...</p>
          </div>
        </form>

        <!-- Result Section -->
        <div id="result-section" class="text-center d-none mt-4">
          <hr>
          <h5>Result</h5>
          <img id="result-img" class="preview-img mb-3" alt="Result Image">
          <p class="fs-5">
            <strong>Prediction:</strong> <span id="result-label" class="text-info"></span><br>
            <strong>Confidence:</strong> <span id="result-confidence" class="text-info"></span>%
          </p>
          <p class="text-muted" style="font-size: 0.9rem;">Hover image to view ELA version.</p>
          <button class="btn btn-outline-secondary" onclick="resetForm()">Try Another Image</button>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');
const preview = document.getElementById('preview');
const form = document.getElementById('upload-form');
const resultSection = document.getElementById('result-section');
const resultImg = document.getElementById('result-img');
const resultLabel = document.getElementById('result-label');
const resultConfidence = document.getElementById('result-confidence');
const loadingIndicator = document.getElementById('loading-indicator');

const validTypes = ['image/jpeg', 'image/png'];

dropArea.addEventListener('click', () => fileInput.click());
['dragenter', 'dragover'].forEach(e =>
  dropArea.addEventListener(e, ev => {
    ev.preventDefault();
    dropArea.classList.add('border-primary');
  })
);
['dragleave', 'drop'].forEach(e =>
  dropArea.addEventListener(e, ev => {
    ev.preventDefault();
    dropArea.classList.remove('border-primary');
  })
);

dropArea.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (validateFile(file)) {
    fileInput.files = e.dataTransfer.files;
    showPreview(file);
  }
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (validateFile(file)) {
    showPreview(file);
  }
});

function validateFile(file) {
  if (!validTypes.includes(file.type)) {
    alert('Only JPG and PNG files are allowed.');
    return false;
  }
  return true;
}

function showPreview(file) {
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.classList.remove('d-none');
  };
  reader.readAsDataURL(file);
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!validateFile(file)) return;

  loadingIndicator.classList.remove('d-none');

  const formData = new FormData();
  formData.append('file', file);

  fetch('/predict', {
    method: 'POST',
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      loadingIndicator.classList.add('d-none');
      if (data.success) {
        form.classList.add('d-none');
        resultSection.classList.remove('d-none');
        resultLabel.textContent = data.prediction;
        resultConfidence.textContent = data.confidence;
        resultImg.src = `/static/uploads/${data.filename}`;
        resultImg.setAttribute('data-original', `/static/uploads/${data.filename}`);
        resultImg.setAttribute('data-ela', `/static/ela/${data.filename}`);
        resultImg.addEventListener('mouseover', () => {
          resultImg.src = resultImg.dataset.ela;
        });
        resultImg.addEventListener('mouseout', () => {
          resultImg.src = resultImg.dataset.original;
        });
      } else {
        alert(data.message || "Prediction failed.");
      }
    })
    .catch(err => {
      loadingIndicator.classList.add('d-none');
      alert("An error occurred: " + err);
    });
});

function resetForm() {
  form.reset();
  fileInput.value = '';
  preview.classList.add('d-none');
  resultSection.classList.add('d-none');
  form.classList.remove('d-none');
}
</script>
</body>
</html>
